name: Postman Integration Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Start MariaDB
        run: |
          docker run -d --name bstrong-db \
            -e MYSQL_USER=gymAdmin \
            -e MYSQL_PASSWORD=gymPasswd \
            -e MYSQL_DATABASE=bstrong \
            -e MYSQL_ROOT_PASSWORD=secure_root_password \
            -p 3306:3306 mariadb:11.3.2
          sleep 30

      - name: Start API
        run: |
          nohup java -jar target/bstrong-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url=jdbc:mariadb://localhost:3306/bstrong \
            --spring.datasource.username=gymAdmin \
            --spring.datasource.password=gymPasswd \
            --spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect \
            --spring.jpa.hibernate.ddl-auto=update \
            --spring.config.import='' \
            --spring.profiles.active='' > api.log 2>&1 &
          sleep 30

      - name: Show API logs
        if: always()
        run: cat api.log
      - name: Load initial data
        run: |
          curl -s -X POST http://localhost:8080/monitors \
            -H "Content-Type: application/json" \
            -d '{"name":"Test Monitor","dni":"12345678A","hireDate":"2024-01-01","salary":2000,"available":true,"specialty":"Yoga"}'
          curl -s -X POST http://localhost:8080/members \
             -H "Content-Type: application/json" \
            -d '{"firstName":"Jack","lastName":"Sparrow","birthDate":"1980-01-01","weight":80,"email":"jack@test.com","active":true}'
          curl -s -X POST http://localhost:8080/members \
            -H "Content-Type: application/json" \
            -d '{"firstName":"Davy","lastName":"Jones","birthDate":"1975-05-10","weight":90,"email":"davy@test.com","active":true}'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: newman run bStrong.postman_collection.json