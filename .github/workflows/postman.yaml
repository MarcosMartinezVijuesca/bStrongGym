name: Postman Integration Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Start MariaDB
        run: |
          docker run -d \
            --name bstrong-db \
            -e MYSQL_USER=gymAdmin \
            -e MYSQL_PASSWORD=gymPasswd \
            -e MYSQL_DATABASE=bstrong \
            -e MYSQL_ROOT_PASSWORD=secure_root_password \
            -p 3306:3306 \
            mariadb:11.3.2
          sleep 15

      - name: Start API
        run: |
          java -jar target/bstrong-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url=jdbc:mariadb://localhost:3306/bstrong \
            --spring.datasource.username=gymAdmin \
            --spring.datasource.password=gymPasswd \
            --spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect \
            --spring.config.import= \
            --spring.profiles.active= &
          sleep 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman tests
        run: newman run bStrong.postman_collectionV2.1.json